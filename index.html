// ── 模擬試験ロジック ──────────────────────────────────────────
// R6/R7（新形式）と R3-R5（旧形式）でセクション構成が異なる。
// 「役割」ごとに全年度の問題をまとめてランダム抽出することで
// 年度横断ミックスの模擬試験を実現する。
//
// 新形式 (R6/R7) のセクション構成:
//   AM-A: No.1-6   必答6問  → 役割: am_required_small
//   AM-B: No.7-12  6問中4問 → 役割: am_select_B
//   AM-C: No.13-44 32問中14問 → 役割: am_select_C
//   AM-D: No.45-52 8問中5問 → 役割: am_select_D
//   AM-E: No.53-54 必答2問  → 役割: am_required_tiny
//   PM-A: No.55-60 必答6問（応用）→ 役割: pm_required_A
//   PM-B: No.61-67 必答7問  → 役割: pm_required_B
//   PM-C: No.68-76 9問中6問 → 役割: pm_select_C
//   PM-D: No.77-89 13問中10問 → 役割: pm_select_D
//
// 旧形式 (R3-R5) のセクション構成:
//   AM-A: No.1-15  15問中10問 → 役割: am_select_B + am_required_small の合体
//   AM-B: No.16-47 32問中14問 → 役割: am_select_C
//   AM-C: No.48-55 8問中5問  → 役割: am_select_D
//   AM-D: No.56-57 必答2問   → 役割: am_required_tiny
//   PM-A: No.58-63 必答6問   → 役割: pm_required_A
//   PM-B: No.64-70 必答7問   → 役割: pm_required_B
//   PM-C: No.71-79 9問中6問  → 役割: pm_select_C
//   PM-D: No.80-92 13問中10問 → 役割: pm_select_D
//
// 模擬試験の構成（計54問）:
//   必答グループ1 (am_g1):  新形式AM-A(6問) or 旧形式AM-A相当(10問) → 新形式に統一して6問ランダム
//   選択グループB (am_gB):  4問
//   選択グループC (am_gC): 14問
//   選択グループD (am_gD):  5問
//   必答グループ2 (am_g2):  2問
//   必答グループ3 (pm_gA):  6問
//   必答グループ4 (pm_gB):  7問
//   選択グループE (pm_gC):  6問
//   選択グループF (pm_gD): 10問
//   合計: 6+4+14+5+2+6+7+6+10 = 60問（実際の試験と同じ）

const MOCK_SECTION_DEFS = [
  { id: "am_g1",  label: "午前①（電気理論・電力系統）",       required: true,  count: 6  },
  { id: "am_gB",  label: "午前②（発電・変電・送配電）選択",    required: false, count: 4  },

  { id: "pm_gD",  label: "午後④（法規・施工）選択",            required: false, count: 10 },
];

// 各年度・各セクションを「役割」にマッピング
const ROLE_MAP = {
  R7: { "AM-A": "am_g1", "AM-B": "am_gB", "AM-C": "am_gC", "AM-D": "am_gD", "AM-E": "am_g2", "PM-A": "pm_gA", "PM-B": "pm_gB", "PM-C": "pm_gC", "PM-D": "pm_gD" },
  R6: { "AM-A": "am_g1", "AM-B": "am_gB", "AM-C": "am_gC", "AM-D": "am_gD", "AM-E": "am_g2", "PM-A": "pm_gA", "PM-B": "pm_gB", "PM-C": "pm_gC", "PM-D": "pm_gD" },
  R5: { "AM-A": "am_gB", "AM-B": "am_gC", "AM-C": "am_gD", "AM-D": "am_g2", "PM-A": "pm_gA", "PM-B": "pm_gB", "PM-C": "pm_gC", "PM-D": "pm_gD" },
  R4: { "AM-A": "am_gB", "AM-B": "am_gC", "AM-C": "am_gD", "AM-D": "am_g2", "PM-A": "pm_gA", "PM-B": "pm_gB", "PM-C": "pm_gC", "PM-D": "pm_gD" },
  R3: { "AM-A": "am_gB", "AM-B": "am_gC", "AM-C": "am_gD", "AM-D": "am_g2", "PM-A": "pm_gA", "PM-B": "pm_gB", "PM-C": "pm_gC", "PM-D": "pm_gD" },
  R2: { "AM-A": "am_gB", "AM-B": "am_gC", "AM-C": "am_gD", "AM-D": "am_g2", "PM-A": "pm_gC", "PM-B": "pm_gA", "PM-C": "pm_gD" },
  R1: { "AM-A": "am_gB", "AM-B": "am_gC", "AM-C": "am_gD", "AM-D": "am_g2", "PM-A": "pm_gC", "PM-B": "pm_gA", "PM-C": "pm_gD" },
};

// am_g1（必答6問）は新形式のAM-Aのみから取得。旧形式はam_gBへ寄せているので
// am_g1プールは R6/R7 のみ。不足する場合はam_gBプールから補完。
function buildMockQueue() {
  // roleId → 全年度の問題を集めたプール
  const pool = {};
  MOCK_SECTION_DEFS.forEach(s => { pool[s.id] = []; });

  YEAR_ORDER.forEach(yr => {
    const bank = QUESTION_BANK[yr];
    const roleMap = ROLE_MAP[yr] || {};
    bank.sections.forEach(sec => {
      const role = roleMap[sec.id];
      if (!role) return;
      sec.questionNos.forEach(no => {
        const q = bank.questions[no];
        if (q) pool[role].push({ ...q, _year: yr });
      });
    });
  });

  // am_g1（新形式AM-Aのみ）が少ない場合は am_gB から補完しない
  // → 新形式2年分（R6+R7）で12問あるので6問の抽出には十分

  const result = [];
  MOCK_SECTION_DEFS.forEach(({ id, count }) => {
    const shuffled = [...pool[id]].sort(() => Math.random() - 0.5);
    result.push(...shuffled.slice(0, count));
  });

  return result;
}

// ── IndexedDB図版管理 ──────────────────────────────────────────
const FIG_DB_NAME = "seiko_fig_db";
const FIG_DB_VER  = 1;
const FIG_STORE   = "fig_images";

function openFigDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FIG_DB_NAME, FIG_DB_VER);
    req.onupgradeneeded = e => e.target.result.createObjectStore(FIG_STORE);
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

async function loadFigFromDB() {
  try {
    const db = await openFigDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(FIG_STORE, "readonly");
      const req = tx.objectStore(FIG_STORE).getAll();
      const keyReq = tx.objectStore(FIG_STORE).getAllKeys();
      let vals, keys;
      req.onsuccess = e => { vals = e.target.result; if (keys) done(); };
      keyReq.onsuccess = e => { keys = e.target.result; if (vals) done(); };
      req.onerror = keyReq.onerror = e => reject(e.target.error);
      function done() {
        const obj = {};
        keys.forEach((k, i) => { obj[k] = vals[i]; });
        resolve(obj);
      }
    });
  } catch { return {}; }
}

async function saveFigToDB(key, dataUrl) {
  try {
    const db = await openFigDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(FIG_STORE, "readwrite");
      tx.objectStore(FIG_STORE).put(dataUrl, key);
      tx.oncomplete = () => resolve();
      tx.onerror = e => reject(e.target.error);
    });
  } catch(e) { console.warn("図版の保存失敗", e); }
}

async function deleteFigFromDB(key) {
  try {
    const db = await openFigDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(FIG_STORE, "readwrite");
      tx.objectStore(FIG_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = e => reject(e.target.error);
    });
  } catch(e) { console.warn("図版の削除失敗", e); }
}

const FigZoomOverlay = ({ src, onClose }) => {
  const [scale, setScale] = useState(1);
  const lastTap = useRef(0);
  const lastDist = useRef(null);
  const imgRef = useRef(null);
  function zoomIn() { setScale(s => Math.min(5, s + 0.5)); }
  function zoomOut() { setScale(s => Math.max(1, s - 0.5)); }
  function zoomReset() { setScale(1); }
  function handleClick(e) {
    const now = Date.now();
    if (now - lastTap.current < 300) { setScale(s => s > 1 ? 1 : 2); }
    lastTap.current = now;
  }
  function onWheel(e) { e.preventDefault(); setScale(s => Math.max(1, Math.min(5, s + (e.deltaY > 0 ? -0.3 : 0.3)))); }
  function getDist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  function onTouchStart(e) { if (e.touches.length === 2) { e.preventDefault(); lastDist.current = getDist(e.touches); } }
  function onTouchMove(e) {
    if (e.touches.length === 2 && lastDist.current) {
      e.preventDefault();
      const d = getDist(e.touches);
      setScale(s => Math.max(1, Math.min(5, s * (d / lastDist.current))));
      lastDist.current = d;
    }
  }
  function onTouchEnd() { lastDist.current = null; }
  return (
    <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.9)", zIndex: 10000, display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 12px", flexShrink: 0 }}>
        <div style={{ display: "flex", gap: "6px" }}>
          <button onClick={zoomOut} style={{ background: "rgba(255,255,255,0.15)", color: "#fff", border: "none", borderRadius: "6px", width: 36, height: 36, fontSize: "20px", cursor: "pointer" }}>−</button>
          <button onClick={zoomReset} style={{ background: "rgba(255,255,255,0.15)", color: "#fff", border: "none", borderRadius: "6px", padding: "0 10px", height: 36, fontSize: "13px", cursor: "pointer" }}>{Math.round(scale * 100)}%</button>
          <button onClick={zoomIn} style={{ background: "rgba(255,255,255,0.15)", color: "#fff", border: "none", borderRadius: "6px", width: 36, height: 36, fontSize: "20px", cursor: "pointer" }}>+</button>
        </div>
        <button onClick={onClose} style={{ background: "rgba(255,255,255,0.15)", color: "#fff", border: "none", borderRadius: "99px", width: 36, height: 36, fontSize: "18px", cursor: "pointer" }}>✕</button>
      </div>
      <div
        onClick={handleClick} onWheel={onWheel}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        style={{ flex: 1, overflow: "auto", WebkitOverflowScrolling: "touch", display: "flex", alignItems: "center", justifyContent: "center", touchAction: "pan-x pan-y" }}
      >
        <img ref={imgRef} src={src} alt="図（拡大）" style={{ width: `${scale * 100}%`, maxWidth: "none", display: "block" }} />
      </div>
    </div>
  );
};

  const [calcHyp, setCalcHyp] = useState(false);
  const [calcMemory, setCalcMemory] = useState({ A:0, B:0, C:0, D:0, M:0 });
  const [calcShowMem, setCalcShowMem] = useState(false);
  const [calcLastAns, setCalcLastAns] = useState("0");
  const [calcFracMode, setCalcFracMode] = useState(false); // 分数入力中
  const [calcFracNum, setCalcFracNum] = useState(""); // 分子
  const [calcFracDen, setCalcFracDen] = useState(""); // 分母
  const [calcFracField, setCalcFracField] = useState("num"); // "num" or "den"
  const [calcMixedMode, setCalcMixedMode] = useState(false); // 帯分数モード
  const [calcMixedWhole, setCalcMixedWhole] = useState(""); // 帯分数整数部
  const dragRef = useRef(null);
  const dragStartRef = useRef(null);
  const isDraggingRef = useRef(false);

  // ── 分数ユーティリティ ──
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
  function toFraction(decimal) {
    if (!isFinite(decimal) || Number.isInteger(decimal)) return null;
    // 分数変換: 精度12桁まで
    const sign = decimal < 0 ? -1 : 1;
    const abs = Math.abs(decimal);
    // 連分数展開で近似
    let h1 = 1, h2 = 0, k1 = 0, k2 = 1;
    let x = abs;
    for (let i = 0; i < 30; i++) {
      const a = Math.floor(x);
      const h = a * h1 + h2;
      const k = a * k1 + k2;
      if (k > 1e9) break;
      h2 = h1; h1 = h; k2 = k1; k1 = k;
      const rem = x - a;
      if (Math.abs(rem) < 1e-12) break;
      x = 1 / rem;
    }
    if (k1 === 0 || k1 === 1) return null;
    // 検証
    if (Math.abs(sign * h1 / k1 - decimal) > 1e-10) return null;
    const g = gcd(h1, k1);
    const n = sign * (h1 / g);
    const d = k1 / g;
    if (d > 9999 || d <= 1) return null; // 分母が大きすぎるか1なら無意味
    return { n: Math.round(n), d: Math.round(d) };
  }
  function toMixedFrac(frac) {
    if (!frac || frac.d <= 0) return null;
    const sign = frac.n < 0 ? -1 : 1;
    const absN = Math.abs(frac.n);
    if (absN < frac.d) return null; // 真分数なので帯分数不要
    const whole = Math.floor(absN / frac.d);
    const rem = absN % frac.d;
    if (rem === 0) return null;
    return { whole: sign * whole, n: rem, d: frac.d };
  }

  // ── 分数レンダリングコンポーネント ──
  const FracDisplay = ({ n, d, style }) => (
    <span style={{ display: "inline-flex", flexDirection: "column", alignItems: "center", verticalAlign: "middle", margin: "0 3px", ...style }}>
      <span style={{ fontSize: "0.7em", lineHeight: 1.1, padding: "0 3px" }}>{n}</span>
      <span style={{ width: "100%", height: "1.5px", background: "currentColor", minWidth: "14px" }}></span>
      <span style={{ fontSize: "0.7em", lineHeight: 1.1, padding: "0 3px" }}>{d}</span>
    </span>
  );
  const MixedFracDisplay = ({ whole, n, d, style }) => (
    <span style={{ display: "inline-flex", alignItems: "center", verticalAlign: "middle", ...style }}>
      <span>{whole}</span>
      <FracDisplay n={n} d={d} />
    </span>
  );

  // 分数入力の確定 → 式に挿入
  function calcFracCommit() {
    if (!calcFracNum && !calcFracDen) { setCalcFracMode(false); setCalcMixedMode(false); return; }
    const num = calcFracNum || "0";
    const den = calcFracDen || "1";
    let fracStr;
    if (calcMixedMode && calcMixedWhole) {
      // 帯分数: whole + num/den
      fracStr = "(" + calcMixedWhole + "+(" + num + ")/(" + den + "))";
    } else {
      fracStr = "((" + num + ")/(" + den + "))";
    }
    setCalcExpr(prev => prev + fracStr);
    setCalcFracMode(false); setCalcMixedMode(false);
    setCalcFracNum(""); setCalcFracDen(""); setCalcMixedWhole(""); setCalcFracField("num");
  }

  // 分数入力中のキー処理
  function calcFracAppend(s) {
    if (calcMixedMode && calcFracField === "whole") {
      setCalcMixedWhole(prev => prev + s);
    } else if (calcFracField === "num") {
      setCalcFracNum(prev => prev + s);
    } else {
      setCalcFracDen(prev => prev + s);
    }
  }
  function calcFracBackspace() {
    if (calcMixedMode && calcFracField === "whole") {
      setCalcMixedWhole(prev => prev.slice(0, -1));
    } else if (calcFracField === "num") {
      setCalcFracNum(prev => prev.slice(0, -1));
    } else {
      setCalcFracDen(prev => prev.slice(0, -1));
    }
  }
  function calcFracNextField() {
    if (calcMixedMode) {
      if (calcFracField === "whole") setCalcFracField("num");
      else if (calcFracField === "num") setCalcFracField("den");
      else calcFracCommit();
    } else {
      if (calcFracField === "num") setCalcFracField("den");
      else calcFracCommit();
    }
  }

  // ── ドラッグ処理（しきい値つき・タップ/ドラッグ明確分離） ──
  function calcDragStart(e) {
    if (e.target.tagName === "BUTTON") return;
    e.preventDefault();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const startX = clientX;
    const startY = clientY;
    const origPos = { ...calcPos };
    isDraggingRef.current = false;
    const THRESHOLD = 5;
    function onMove(ev) {
      const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
      const dx = cx - startX;
      const dy = cy - startY;
      if (!isDraggingRef.current && Math.abs(dx) + Math.abs(dy) < THRESHOLD) return;
      isDraggingRef.current = true;
      ev.preventDefault();
      const newX = Math.max(0, Math.min(window.innerWidth - 60, origPos.x + dx));
      const newY = Math.max(0, Math.min(window.innerHeight - 60, origPos.y + dy));
      setCalcPos({ x: newX, y: newY });
    }
    function onEnd() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onEnd);
      document.removeEventListener("touchmove", onMove);
      document.removeEventListener("touchend", onEnd);
    }
    document.addEventListener("mousemove", onMove, { passive: false });
    document.addEventListener("mouseup", onEnd);
    document.addEventListener("touchmove", onMove, { passive: false });
    document.addEventListener("touchend", onEnd);
  }

  // 数式に文字追加
  function calcAppend(s) {
    if (calcFracMode) { calcFracAppend(s); return; }
    setCalcExpr(prev => prev + s); setCalcShift(false); setCalcHyp(false);
  }

  // 数式評価（カシオ準拠の変換ロジック）
  function calcEval() {
    if (calcFracMode) { calcFracCommit(); return; }
    if (!calcExpr.trim()) return;
    try {
      let expr = calcExpr;
      expr = expr.replace(/×/g, "*").replace(/÷/g, "/");
      expr = expr.replace(/Ans/g, "(" + calcLastAns + ")");
      Object.keys(calcMemory).forEach(k => {
        expr = expr.replace(new RegExp("\\b" + k + "\\b", "g"), "(" + calcMemory[k] + ")");
      });
      expr = expr.replace(/(\d+(?:\.\d+)?)\s*!/g, "factorial($1)");
      expr = expr.replace(/(\d+)\s*P\s*(\d+)/g, "permutations($1,$2)");
      expr = expr.replace(/(\d+)\s*C\s*(\d+)/g, "combinations($1,$2)");
      expr = expr.replace(/sinh⁻¹\(/g, "asinh(").replace(/cosh⁻¹\(/g, "acosh(").replace(/tanh⁻¹\(/g, "atanh(");
      expr = expr.replace(/sin⁻¹\(/g, "__asin__(").replace(/cos⁻¹\(/g, "__acos__(").replace(/tan⁻¹\(/g, "__atan__(");
      if (calcDeg) {
        expr = expr.replace(/(?<!a)sin\(/g, "sin(pi/180*");
        expr = expr.replace(/(?<!a)cos\(/g, "cos(pi/180*");
        expr = expr.replace(/(?<!a)tan\(/g, "tan(pi/180*");
        expr = expr.replace(/sin\(pi\/180\*h\(/g, "sinh(");
        expr = expr.replace(/__asin__\(/g, "(180/pi)*asin(");
        expr = expr.replace(/__acos__\(/g, "(180/pi)*acos(");
        expr = expr.replace(/__atan__\(/g, "(180/pi)*atan(");
      } else {
        expr = expr.replace(/__asin__\(/g, "asin(");
        expr = expr.replace(/__acos__\(/g, "acos(");
        expr = expr.replace(/__atan__\(/g, "atan(");
      }
      expr = expr.replace(/10\^/g, "10^").replace(/EXP\(/g, "exp(");
      expr = expr.replace(/Abs\(/g, "abs(");
      const result = math.evaluate(expr);
      let display;
      if (typeof result === "object" && result.toString) { display = result.toString(); }
      else { display = String(result); }
      if (typeof result === "number" && !Number.isInteger(result)) {
        display = String(parseFloat(result.toPrecision(12)));
      }
      // 分数変換を試みる（カシオ自然表示）
      const frac = (typeof result === "number") ? toFraction(result) : null;
      setCalcResultFrac(frac);
      setCalcShowDecimal(false);
      setCalcResult(display);
      setCalcLastAns(display);
      setCalcHistory(prev => [...prev.slice(-29), { expr: calcExpr, result: display, frac: frac }]);
    } catch (e) {
      setCalcResult("Error: " + e.message.substring(0, 40));
      setCalcResultFrac(null);
    }
  }

  // S⇔D切り替え（カシオFORMAT相当）
  function calcToggleSD() {
    if (calcResultFrac) { setCalcShowDecimal(!calcShowDecimal); }
    setCalcShift(false);
  }

  function calcClear() { setCalcExpr(""); setCalcResult(""); setCalcResultFrac(null); setCalcShowDecimal(false); setCalcShift(false); setCalcHyp(false); setCalcFracMode(false); setCalcFracNum(""); setCalcFracDen(""); setCalcMixedWhole(""); setCalcFracField("num"); setCalcMixedMode(false); }
  function calcBackspace() {
    if (calcFracMode) { calcFracBackspace(); return; }
    setCalcExpr(prev => prev.slice(0, -1));
  }
  function calcUseResult() { if (calcResult && !calcResult.startsWith("Error")) { setCalcExpr(calcResult); setCalcResult(""); setCalcResultFrac(null); } }
  function calcMemStore(key) { try { const v = calcResult && !calcResult.startsWith("Error") ? parseFloat(calcResult) : 0; setCalcMemory(prev => ({...prev, [key]: v})); } catch {} }
  function calcMemAdd() { try { const v = calcResult && !calcResult.startsWith("Error") ? parseFloat(calcResult) : 0; setCalcMemory(prev => ({...prev, M: prev.M + v})); } catch {} }

  // 式中の分数パターンを自然表示に変換するレンダラー
  function renderExprNatural(expr) {
    if (!expr) return "\u00a0";
    // ((num)/(den)) パターンを検出してReact要素に
    const parts = [];
    let remaining = expr;
    // 帯分数: (whole+((num)/(den)))
    const mixedRe = /\((-?\d+(?:\.\d+)?)\+\(\((\d+(?:\.\d+)?)\)\/\((\d+(?:\.\d+)?)\)\)\)/;
    const fracRe = /\(\((-?\d+(?:\.\d+)?)\)\/\((\d+(?:\.\d+)?)\)\)/;
    let key = 0;
    while (remaining) {
      const mixedMatch = remaining.match(mixedRe);
      const fracMatch = remaining.match(fracRe);
      // 最初に出てくるものを処理
      let match = null, type = null;
      if (mixedMatch && fracMatch) {
        if (remaining.indexOf(mixedMatch[0]) <= remaining.indexOf(fracMatch[0])) { match = mixedMatch; type = "mixed"; }
        else { match = fracMatch; type = "frac"; }
      } else if (mixedMatch) { match = mixedMatch; type = "mixed"; }
      else if (fracMatch) { match = fracMatch; type = "frac"; }

      if (match) {
        const idx = remaining.indexOf(match[0]);
        if (idx > 0) parts.push(<span key={key++}>{remaining.substring(0, idx)}</span>);
        if (type === "mixed") {
          parts.push(<MixedFracDisplay key={key++} whole={match[1]} n={match[2]} d={match[3]} />);
        } else {
          parts.push(<FracDisplay key={key++} n={match[1]} d={match[2]} />);
        }
        remaining = remaining.substring(idx + match[0].length);
      } else {
        parts.push(<span key={key++}>{remaining}</span>);
        remaining = "";
      }
    }
    return parts.length > 0 ? parts : "\u00a0";
  }

  // 結果の自然表示レンダラー
  function renderResultNatural() {
    if (!calcResult) return "\u00a0";
    if (calcResult.startsWith("Error")) return calcResult;
    if (calcResultFrac && !calcShowDecimal) {
      const mixed = toMixedFrac(calcResultFrac);
      // SHIFTで帯分数表示トグルは将来用、ここでは仮分数
      return React.createElement(FracDisplay, { n: calcResultFrac.n, d: calcResultFrac.d, style: { fontSize: "22px" } });
    }
    return calcResult;
  }

  // ── カシオ風ボタンコンポーネント ──
  const CB = ({ label, sub, onClick, bg, color, fs, title, w, active }) => (
    <button onClick={(e) => { e.stopPropagation(); onClick(); }} title={title || (typeof label === "string" ? label : "")} style={{
      background: active ? "#3b82f6" : (bg || "#f8fafc"), border: "1px solid " + (active ? "#2563eb" : "#e2e8f0"),
      borderRadius: "8px", padding: "6px 2px", fontSize: fs || "13px", fontWeight: "600",
      color: active ? "#fff" : (color || "#1e293b"), cursor: "pointer", minWidth: 0,
      transition: "all 0.1s", lineHeight: 1.1, position: "relative",
      gridColumn: w ? "span " + w : undefined,
      boxShadow: "0 1px 2px rgba(0,0,0,0.06)"
    }}>{label}{sub ? <span style={{ display: "block", fontSize: "9px", color: active ? "#dbeafe" : "#94a3b8", fontWeight: "400", marginTop: "1px" }}>{sub}</span> : null}</button>
  );

  const CalcModal = () => {
    if (!calcOpen) return null;
    if (calcMinimized) return (
      <div style={{ position: "fixed", left: calcPos.x, top: calcPos.y, zIndex: 9999, touchAction: "none" }}
        onMouseDown={calcDragStart} onTouchStart={calcDragStart}>
        <div onClick={() => { if (!isDraggingRef.current) setCalcMinimized(false); }}
          style={{ background: "linear-gradient(135deg, #1e293b, #334155)", color: "white", borderRadius: "14px", width: 52, height: 52, display: "flex", alignItems: "center", justifyContent: "center", cursor: "grab", boxShadow: "0 4px 16px rgba(0,0,0,0.35)", fontSize: "22px", userSelect: "none" }}>
          🔢
        </div>
      </div>
    );

    const shifted = calcShift;
    const hyp = calcHyp;

    return (
      <div ref={dragRef} style={{
        position: "fixed", left: calcPos.x, top: calcPos.y, zIndex: 9999,
        width: 340, background: "#f8fafc", borderRadius: "16px",
        boxShadow: "0 12px 40px rgba(0,0,0,0.3)", overflow: "hidden", userSelect: "none", touchAction: "none"
      }}>
        {/* タイトルバー（ドラッグ専用ハンドル） */}
        <div onMouseDown={calcDragStart} onTouchStart={calcDragStart}
          style={{ background: "linear-gradient(135deg, #0f172a, #1e293b)", padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "grab" }}>
          <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
            <span style={{ color: "#e2e8f0", fontSize: "13px", fontWeight: "bold", letterSpacing: "0.5px" }}>CASIO風 関数電卓</span>
            <span style={{ background: calcDeg ? "#3b82f6" : "#8b5cf6", color: "#fff", fontSize: "10px", padding: "2px 6px", borderRadius: "4px", fontWeight: "bold" }}>
              {calcDeg ? "DEG" : "RAD"}
            </span>
            {shifted && <span style={{ background: "#f59e0b", color: "#000", fontSize: "10px", padding: "2px 5px", borderRadius: "4px", fontWeight: "bold" }}>SHIFT</span>}
            {hyp && <span style={{ background: "#10b981", color: "#fff", fontSize: "10px", padding: "2px 5px", borderRadius: "4px", fontWeight: "bold" }}>HYP</span>}
          </div>
          <div style={{ display: "flex", gap: "6px" }}>
            <button onClick={() => setCalcMinimized(true)} style={{ background: "none", border: "none", color: "#64748b", fontSize: "18px", cursor: "pointer", padding: "0 4px" }}>−</button>
            <button onClick={() => setCalcOpen(false)} style={{ background: "none", border: "none", color: "#64748b", fontSize: "18px", cursor: "pointer", padding: "0 4px" }}>✕</button>
          </div>
        </div>

        {/* 数式表示エリア（カシオ風LCD + 数学自然表示） */}
        <div style={{ background: "#c8d1c0", padding: "10px 14px", minHeight: 80, borderBottom: "2px solid #a0aa96", margin: "0" }}>
          <div style={{ color: "#2d3a28", fontSize: "13px", fontFamily: "'Courier New', monospace", minHeight: "22px", marginBottom: "4px", textAlign: "right", display: "flex", flexWrap: "wrap", justifyContent: "flex-end", alignItems: "center", gap: "1px" }}>
            {renderExprNatural(calcExpr)}
          </div>
          <div onClick={calcUseResult} style={{
            color: (calcResult && calcResult.startsWith("Error")) ? "#b91c1c" : "#1a2716",
            fontSize: "24px", fontWeight: "bold", fontFamily: "'Courier New', monospace",
            cursor: calcResult && !calcResult.startsWith("Error") ? "pointer" : "default",
            textAlign: "right", letterSpacing: "1px", display: "flex", justifyContent: "flex-end", alignItems: "center", minHeight: "32px"
          }}>
            {renderResultNatural()}
          </div>
        </div>

        {/* 分数入力パネル（テンプレート入力中のみ表示） */}
        {calcFracMode && (
          <div style={{ background: "#fffbeb", padding: "8px 14px", borderBottom: "1px solid #fde68a", display: "flex", alignItems: "center", gap: "10px" }}>
            <span style={{ fontSize: "11px", color: "#92400e", fontWeight: "bold" }}>{calcMixedMode ? "帯分数" : "分数"}:</span>
            <div style={{ display: "flex", alignItems: "center", gap: "4px" }}>
              {calcMixedMode && (
                <React.Fragment>
                  <div onClick={() => setCalcFracField("whole")} style={{
                    border: calcFracField === "whole" ? "2px solid #2563eb" : "1px solid #d1d5db", borderRadius: "4px",
                    padding: "2px 8px", minWidth: 28, fontSize: "16px", fontFamily: "monospace", textAlign: "center",
                    background: calcFracField === "whole" ? "#dbeafe" : "#fff", cursor: "pointer"
                  }}>
                    {calcMixedWhole || <span style={{ color: "#d1d5db" }}>?</span>}
                  </div>
                  <span style={{ fontSize: "11px", color: "#6b7280" }}>&nbsp;</span>
                </React.Fragment>
              )}
              <div style={{ display: "inline-flex", flexDirection: "column", alignItems: "center" }}>
                <div onClick={() => setCalcFracField("num")} style={{
                  border: calcFracField === "num" ? "2px solid #2563eb" : "1px solid #d1d5db", borderRadius: "4px",
                  padding: "2px 8px", minWidth: 32, fontSize: "15px", fontFamily: "monospace", textAlign: "center",
                  background: calcFracField === "num" ? "#dbeafe" : "#fff", cursor: "pointer"
                }}>
                  {calcFracNum || <span style={{ color: "#d1d5db" }}>分子</span>}
                </div>
                <div style={{ width: "100%", height: "2px", background: "#1e293b", margin: "2px 0" }}></div>
                <div onClick={() => setCalcFracField("den")} style={{
                  border: calcFracField === "den" ? "2px solid #2563eb" : "1px solid #d1d5db", borderRadius: "4px",
                  padding: "2px 8px", minWidth: 32, fontSize: "15px", fontFamily: "monospace", textAlign: "center",
                  background: calcFracField === "den" ? "#dbeafe" : "#fff", cursor: "pointer"
                }}>
                  {calcFracDen || <span style={{ color: "#d1d5db" }}>分母</span>}
                </div>
              </div>
            </div>
            <div style={{ display: "flex", gap: "4px", marginLeft: "auto" }}>
              <button onClick={calcFracNextField} style={{ background: "#2563eb", color: "#fff", border: "none", borderRadius: "4px", padding: "4px 10px", fontSize: "11px", cursor: "pointer", fontWeight: "bold" }}>
                {(calcFracField === "den" || (!calcMixedMode && calcFracField === "den")) ? "確定" : "▼次"}
              </button>
              <button onClick={() => { setCalcFracMode(false); setCalcMixedMode(false); setCalcFracNum(""); setCalcFracDen(""); setCalcMixedWhole(""); setCalcFracField("num"); }} style={{ background: "#fecaca", color: "#991b1b", border: "none", borderRadius: "4px", padding: "4px 8px", fontSize: "11px", cursor: "pointer" }}>取消</button>
            </div>
          </div>
        )}

        {/* メモリ表示（トグル） */}
        {calcShowMem && (
          <div style={{ background: "#f1f5f9", padding: "6px 12px", display: "flex", gap: "6px", flexWrap: "wrap", borderBottom: "1px solid #e2e8f0" }}>
            {Object.entries(calcMemory).map(([k, v]) => (
              <div key={k} style={{ fontSize: "11px", fontFamily: "monospace", color: "#475569" }}>
                <span style={{ fontWeight: "bold", color: "#2563eb" }}>{k}</span>={v}
                <button onClick={() => calcAppend(k)} style={{ border: "none", background: "#dbeafe", fontSize: "10px", borderRadius: "3px", marginLeft: "2px", cursor: "pointer", padding: "1px 4px" }}>挿入</button>
              </div>
            ))}
            <button onClick={() => setCalcShowMem(false)} style={{ fontSize: "10px", border: "none", background: "#fecaca", borderRadius: "3px", cursor: "pointer", padding: "1px 6px", color: "#991b1b" }}>閉</button>
          </div>
        )}

        {/* モード・修飾キー行 */}
        <div style={{ padding: "6px 8px 2px", display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: "3px" }}>
          <CB label="SHIFT" onClick={() => { setCalcShift(!calcShift); setCalcHyp(false); }} bg={shifted ? "#fbbf24" : "#fef3c7"} color={shifted ? "#000" : "#92400e"} fs="10px" active={shifted} />
          <CB label={calcDeg ? "DEG" : "RAD"} sub="角度" onClick={() => setCalcDeg(!calcDeg)} bg="#ede9fe" color="#5b21b6" fs="10px" />
          <CB label="HYP" onClick={() => { setCalcHyp(!hyp); setCalcShift(false); }} bg={hyp ? "#6ee7b7" : "#ecfdf5"} color={hyp ? "#000" : "#065f46"} fs="10px" active={hyp} />

    if (mode === "wrong") pool = pool.filter(d => mbHistory[d.id] && mbHistory[d.id].lastAns === false);
    if (mode === "unanswered") pool = pool.filter(d => !mbHistory[d.id]);
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    setMbQueue(shuffled); setMbIdx(0); setMbChosen(null); setMbShowAns(false); setMbResults([]);
    setView("marubatsu");

  function mbAnswer(ans) {
    if (mbShowAns) return;
    const q = mbQueue[mbIdx];
    const isCorrect = ans === q.answer;
    setMbChosen(ans); setMbShowAns(true);
    setMbResults(prev => [...prev, { id: q.id, correct: isCorrect, userAns: ans }]);
    const h = { ...mbHistory };
    const prev = h[q.id] || { correct: 0, wrong: 0 };
    h[q.id] = { correct: prev.correct + (isCorrect ? 1 : 0), wrong: prev.wrong + (isCorrect ? 0 : 1), lastAns: isCorrect };
    saveMbHistory(h);
  }
  function mbNext() {
    if (mbIdx + 1 >= mbQueue.length) { setView("mbResult"); return; }
    setMbIdx(mbIdx + 1); setMbChosen(null); setMbShowAns(false);

  // 得意不得意分析（カテゴリ別正解率）
  function getAnalysis() {
    const cats = {};
    YEAR_ORDER.forEach(yr => {
      Object.values(QUESTION_BANK[yr].questions).forEach(q => {
        const cat = q.category;
        if (!cats[cat]) cats[cat] = { correct: 0, total: 0 };
        const v = progress[`${yr}_${q.no}`];
        if (v !== undefined) {
          cats[cat].total++;
          if (v === true) cats[cat].correct++;
        }
      });
    });
    return Object.entries(cats)
      .filter(([, v]) => v.total >= 3)
      .map(([cat, v]) => ({ cat, pct: Math.round(v.correct / v.total * 100), total: v.total, correct: v.correct }))
      .sort((a, b) => a.pct - b.pct);
  }

    nos.forEach(n => {

      if (v !== undefined) answered++;
      if (v === true) correct++;

    return { total: nos.length, answered, correct };

問題文・選択肢・解説から図の内容を推測し、受験者が解答できるように図の回路・構成・数値を簡潔にテキストで補足説明してください。
推測が困難な場合は「この問題は図が必要です。解説を参考に学習してください。」とだけ返してください。

【問題文】${q.q}
【選択肢】${q.opts.map((o,i)=>`${i+1}.${o}`).join(" / ")}
【解説】${q.exp}

補足説明（100字以内で簡潔に）：`;

    fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": "sk-ant-api03-y9FB519U_2ysfJHnVjtgkS6Yyax1oJuJ_L18wmjYAMxKF_XYMRTHABZAvWN-hHYiqvuVdxA3pP-ykF0nsQccFQ-urW_dgAA", "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },

  // ○×クイズ画面

                {!rDayOff && (
                  <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>

                    <input value={k} onChange={e => { const u = [...rKy]; u[i] = e.target.value; setRKy(u); }} placeholder={`KY ${i+1}`} style={{ ...inputSt, flex: 1 }} />

                <button onClick={() => setRKy([...rKy, ""])} style={{ background: "#f1f5f9", border: "1px dashed #94a3b8", color: "#64748b", padding: "6px 12px", borderRadius: "6px", cursor: "pointer", fontSize: "12px", width: "100%" }}>＋ KYを追加</button>
              </div>

              {/* 仕事メモ */}
              <div style={sectionSt}>
                <label style={labelSt}>仕事メモ</label>
                <textarea value={rMemo} onChange={e => setRMemo(e.target.value)} rows={4} placeholder="今日の作業内容、気づきなど" style={{ ...inputSt, resize: "vertical" }} />
              </div>

              <button onClick={saveReport} style={{ width: "100%", background: "#2563eb", color: "white", border: "none", padding: "14px", borderRadius: "8px", cursor: "pointer", fontSize: "15px", fontWeight: "bold" }}>日報を保存</button>
            </div>

          {diaryTab === "diary" && (
            <div>
              <div style={sectionSt}>

                <input value={dTitle} onChange={e => setDTitle(e.target.value)} placeholder="今日の学習テーマなど" style={{ ...inputSt, marginBottom: "12px" }} />
                <label style={labelSt}>内容</label>
                <textarea value={dBody} onChange={e => setDBody(e.target.value)} rows={8} placeholder="学んだこと、感想、次にやることなど" style={{ ...inputSt, resize: "vertical" }} />
              </div>
              <button onClick={saveDiaryEntry} style={{ width: "100%", background: "#2563eb", color: "white", border: "none", padding: "14px", borderRadius: "8px", cursor: "pointer", fontSize: "15px", fontWeight: "bold" }}>日記を保存</button>
            </div>
          )}

          {diaryTab === "history" && (
            <div>
              {reportEntries.length === 0 && diaryEntries.length === 0 && (
                <div style={{ textAlign: "center", color: "#94a3b8", padding: "40px 0" }}>まだ記録がありません</div>
              )}
              {/* 日報と日記を日付順（新しい順）で混合表示 */}
              {[
                ...reportEntries.map((r, i) => ({ ...r, _type: "report", _idx: i })),
                ...diaryEntries.map((d, i) => ({ ...d, _type: "diary", _idx: i }))
              ].sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0)).map((entry, i) => (
                <div key={i} style={{ ...sectionSt, position: "relative" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>

                      <span style={{ background: entry._type === "report" ? "#fef3c7" : "#dbeafe", color: entry._type === "report" ? "#92400e" : "#1d4ed8", padding: "2px 8px", borderRadius: "99px", fontSize: "11px", fontWeight: "bold" }}>
                        {entry._type === "report" ? "日報" : "日記"}
                      </span>
                      <span style={{ fontSize: "13px", color: "#64748b" }}>{entry.date}</span>
                    </div>
                    <button onClick={() => entry._type === "report" ? deleteReport(entry._idx) : deleteDiaryEntry(entry._idx)} style={{ background: "none", border: "none", color: "#94a3b8", cursor: "pointer", fontSize: "14px" }}>🗑</button>
                  </div>
                  {entry._type === "report" ? (
                    <div style={{ fontSize: "13px", lineHeight: "1.7" }}>
                      {entry.dayOff ? <div style={{ color: "#64748b" }}>🏠 出勤なし</div> : (
                        <>
                          {entry.sites?.length > 0 && <div>📍 {entry.sites.join("、")}</div>}
                          {(entry.timeStart || entry.timeEnd) && <div>⏰ {entry.timeStart || "?"} 〜 {entry.timeEnd || "?"}</div>}
                        </>
                      )}
                      {entry.ky?.length > 0 && <div style={{ marginTop: "4px" }}>⚠️ KY: {entry.ky.join(" / ")}</div>}
                      {entry.memo && <div style={{ marginTop: "4px", color: "#475569" }}>{entry.memo}</div>}
                    </div>
                  ) : (
                    <div style={{ fontSize: "13px", lineHeight: "1.7" }}>
                      {entry.title && <div style={{ fontWeight: "bold", marginBottom: "4px" }}>{entry.title}</div>}

  if (view === "trivia") {

            <div style={{ fontSize: "11px", color: "#94a3b8", fontWeight: "bold", letterSpacing: "0.08em", marginBottom: "14px" }}>⚡ 電気雑学</div>

              <div style={{ color: "#94a3b8", fontSize: "14px", textAlign: "center", padding: "20px 0" }}>雑学を取得中…</div>

            style={{ width: "100%", background: triviaLoading ? "#94a3b8" : "#2563eb", color: "white", border: "none", padding: "14px", borderRadius: "8px", cursor: triviaLoading ? "default" : "pointer", fontSize: "15px", fontWeight: "bold" }}
          >
            次の問題へ →
          </button>
        </div>
      </div>

  if (view === "quiz" && q) {
    const correct = q.ans - 1;
    const answeredCount = queue.slice(0, idx).length;
    const correctCount = queue.slice(0, idx).filter((_, i) => {
      const k = `${year}_${queue[i].no}`;
      return progress[k] === true;
    }).length;

    return (
      <div style={{ minHeight: "100vh", background: "#F8F4E6", color: "#1e293b", fontFamily: "'Noto Sans JP', sans-serif", padding: "16px" }}>

            <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
              {mockMode && (
                <span style={{ background: "#fef9c3", color: "#854d0e", padding: "3px 10px", borderRadius: "99px", fontSize: "13px", fontWeight: "bold", fontVariantNumeric: "tabular-nums" }}>
                  ⏱ {fmtTime(mockElapsed)}
                </span>
              )}
              <span style={{ color: "#64748b", fontSize: "14px" }}>{idx + 1} / {queue.length}</span>
              <button onClick={() => setCalcOpen(true)} style={{ background: "none", border: "1px solid #e2e8f0", color: "#64748b", padding: "4px 8px", borderRadius: "6px", cursor: "pointer", fontSize: "16px" }} title="電卓">🔢</button>
            </div>
          </div>
          <CalcModal />
          <div style={{ background: "#ffffff", borderRadius: "12px", padding: "20px", marginBottom: "16px" }}>

              <span style={{ background: "#dbeafe", color: "#2563eb", padding: "2px 10px", borderRadius: "99px", fontSize: "12px" }}>{mockMode ? (q._year || year) : bank.label} No.{q.no}</span>
              <span style={{ background: "#dcfce7", color: "#16a34a", padding: "2px 10px", borderRadius: "99px", fontSize: "12px" }}>{q.category}</span>
              {mockMode && <span style={{ background: "#fef9c3", color: "#854d0e", padding: "2px 10px", borderRadius: "99px", fontSize: "12px" }}>模擬試験</span>}
            </div>

            {/* 図画像エリア */}
            {(() => {
              const imgKey = `${q._year || year}_${q.no}`;
              const imgSrc = figImages[imgKey];
              return (
                <div style={{ marginBottom: "14px" }}>
                  {imgSrc && (
                    <div style={{ position: "relative", marginBottom: "8px" }}>
                      <img src={imgSrc} alt="図" onClick={() => setFigZoom(imgSrc)} style={{ width: "100%", borderRadius: "8px", border: "1px solid #e2e8f0", display: "block", cursor: "zoom-in" }} />
                      <button
                        onClick={() => {
                          const updated = { ...figImages };
                          delete updated[imgKey];
                          setFigImages(updated);
                          deleteFigFromDB(imgKey);
                        }}
                        style={{ position: "absolute", top: "6px", right: "6px", background: "rgba(0,0,0,0.5)", color: "white", border: "none", borderRadius: "99px", padding: "2px 8px", fontSize: "11px", cursor: "pointer" }}
                      >✕ 削除</button>
                    </div>
                  )}
                  <label style={{ display: "flex", alignItems: "center", gap: "8px", padding: "8px 12px", background: "#f8fafc", border: "1.5px dashed #cbd5e1", borderRadius: "8px", cursor: "pointer", fontSize: "12px", color: "#94a3b8" }}>
                    <span style={{ fontSize: "16px" }}>🖼️</span>
                    <span>{imgSrc ? "図を差し替え" : "図を追加"}</span>
                    <input
                      type="file"
                      accept="image/*"
                      style={{ display: "none" }}
                      onChange={e => {
                        const file = e.target.files?.[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = ev => {
                          const dataUrl = ev.target.result;
                          setFigImages(prev => ({ ...prev, [imgKey]: dataUrl }));
                          saveFigToDB(imgKey, dataUrl);
                        };
                        reader.readAsDataURL(file);
                      }}
                    />
                  </label>
                </div>
              );
            })()}

            <p style={{ fontSize: "15px", lineHeight: "1.7", margin: 0 }}>{q.q}</p>
            {(() => {
              const cacheKey = `${q._year || year}_${q.no}`;
              const fig = figCache[cacheKey];
              if (!fig) return null;
              if (fig.status === "loading") return (
                <div style={{ marginTop: "12px", padding: "10px 12px", background: "#F8F4E6", border: "1px dashed #cbd5e1", borderRadius: "8px", fontSize: "12px", color: "#94a3b8" }}>
                  📐 図の補足説明を生成中…
                </div>
              );
              return (
                <div style={{ marginTop: "12px", padding: "10px 12px", background: "#fefce8", border: "1px solid #fde68a", borderRadius: "8px", fontSize: "13px", color: "#78350f", lineHeight: "1.6" }}>
                  <span style={{ fontWeight: "bold", marginRight: "6px" }}>📐 図の補足：</span>{fig.text}
                </div>
              );
            })()}
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: "10px", marginBottom: "16px" }}>
            {q.opts.map((opt, i) => {
              let bg = "#ffffff", border = "#1e293b", color = "#1e293b";
              if (chosen !== null) {
                if (i === correct) { bg = "#f0fdf4"; border = "#16a34a"; color = "#15803d"; }
                else if (i === chosen && chosen !== correct) { bg = "#fef2f2"; border = "#dc2626"; color = "#b91c1c"; }
              }
              return (
                <button key={i} onClick={() => answer(i)} style={{ background: bg, border: `1px solid ${border}`, color, padding: "14px 16px", borderRadius: "8px", textAlign: "left", cursor: chosen === null ? "pointer" : "default", fontSize: "14px", lineHeight: "1.5", transition: "all 0.2s" }}>
                  <span style={{ color: "#64748b", marginRight: "8px" }}>{i + 1}.</span>{opt}
                </button>
              );
            })}
          </div>

          {chosen !== null && (
            <div style={{ background: "#ffffff", border: "1px solid #e2e8f0", borderRadius: "10px", padding: "14px", marginBottom: "16px" }}>
              <div style={{ color: chosen === correct ? "#16a34a" : "#dc2626", fontWeight: "bold", marginBottom: "8px", fontSize: "15px" }}>
                {chosen === correct ? "✓ 正解" : "✗ 不正解"}
              </div>
              <p style={{ color: "#475569", fontSize: "13px", lineHeight: "1.7", margin: "0 0 10px" }}>{q.exp}</p>
              {!showAiExp && (
                <button
                  onClick={() => fetchAiExp(q, q._year || year)}
                  style={{ background: "#f1f5f9", border: "1px solid #e2e8f0", color: "#475569", padding: "5px 12px", borderRadius: "6px", cursor: "pointer", fontSize: "12px" }}
                >
                  🤖 もっと詳しく
                </button>
              )}
              {showAiExp && (
                <div style={{ marginTop: "10px", padding: "12px", background: "#f8faff", border: "1px solid #dbeafe", borderRadius: "8px" }}>
                  {aiExpLoading ? (
                    <div style={{ color: "#94a3b8", fontSize: "13px" }}>AI解説を生成中…</div>
                  ) : (
                    <p style={{ color: "#1e3a5f", fontSize: "13px", lineHeight: "1.8", margin: 0, whiteSpace: "pre-wrap" }}>
                      {aiExpCache[`${q._year || year}_${q.no}`]}
                    </p>
                  )}
                </div>
              )}
            </div>
          )}

          {chosen !== null && (
            <button onClick={next} style={{ width: "100%", background: "#2563eb", color: "white", border: "none", padding: "14px", borderRadius: "8px", cursor: "pointer", fontSize: "15px", fontWeight: "bold" }}>
              {idx + 1 < queue.length ? "次の問題 →" : "結果を見る"}
            </button>
          )}
        </div>
      </div>
    );
  }

  if (view === "result") {
    const total = queue.length;
    const correctCount = queue.filter((q, i) => {
      const yr = mockMode ? (q._year || year) : year;
      return progress[`${yr}_${q.no}`] === true;
    }).length;
    const pct = total ? Math.round(correctCount / total * 100) : 0;

    // 模擬試験の場合はセクション別集計
    const mockSectionResults = mockMode ? (() => {
      let pos = 0;
      return MOCK_SECTION_DEFS.map(({ id, label, count }) => {
        const sqs = queue.slice(pos, pos + count);
        pos += count;
        const c = sqs.filter(q => progress[`${q._year || year}_${q.no}`] === true).length;
        return { label, count, correct: c };
      });
    })() : null;

    return (
      <div style={{ minHeight: "100vh", background: "#F8F4E6", color: "#1e293b", fontFamily: "'Noto Sans JP', sans-serif", padding: "16px", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ maxWidth: "400px", width: "100%", textAlign: "center" }}>
          {mockMode && <div style={{ background: "#fef9c3", color: "#854d0e", padding: "4px 12px", borderRadius: "99px", fontSize: "12px", display: "inline-block", marginBottom: "12px" }}>模擬試験 結果</div>}
          <div style={{ fontSize: "64px", fontWeight: "bold", color: pct >= 60 ? "#16a34a" : "#dc2626" }}>{pct}%</div>
          <p style={{ color: "#64748b", marginBottom: "8px" }}>{correctCount} / {total} 問正解</p>
          {mockMode && mockFinishTime != null && (
            <p style={{ color: "#854d0e", background: "#fef9c3", display: "inline-block", padding: "4px 14px", borderRadius: "99px", fontSize: "14px", marginBottom: "16px" }}>
              ⏱ 所要時間 {fmtTime(mockFinishTime)}
            </p>
          )}

          {mockSectionResults && (
            <div style={{ background: "#ffffff", borderRadius: "10px", padding: "14px", marginBottom: "20px", textAlign: "left" }}>
              <div style={{ fontWeight: "bold", fontSize: "13px", color: "#0f172a", marginBottom: "10px" }}>セクション別結果</div>
              {mockSectionResults.map(({ label, count, correct }) => {
                const p = Math.round(correct / count * 100);
                return (
                  <div key={label} style={{ marginBottom: "8px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: "12px", color: "#475569", marginBottom: "3px" }}>
                      <span>{label}</span>
                      <span style={{ color: p >= 60 ? "#16a34a" : "#dc2626", fontWeight: "bold" }}>{correct}/{count} ({p}%)</span>
                    </div>
                    <div style={{ background: "#e2e8f0", borderRadius: "4px", height: "5px" }}>
                      <div style={{ background: p >= 60 ? "#16a34a" : "#dc2626", height: "100%", borderRadius: "4px", width: `${p}%`, transition: "width 0.5s" }} />
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          <button onClick={() => { flushStudyTime(); setView("home"); setMockMode(false); }} style={{ background: "#2563eb", color: "white", border: "none", padding: "12px 32px", borderRadius: "8px", cursor: "pointer", fontSize: "15px" }}>ホームへ戻る</button>
          {mockMode && <div style={{ marginTop: "12px" }}><button onClick={startMock} style={{ background: "none", border: "1px solid #2563eb", color: "#2563eb", padding: "10px 24px", borderRadius: "8px", cursor: "pointer", fontSize: "14px" }}>もう一度（別問題で）</button></div>}
        </div>
      </div>
    );
  }

  // 7. パスワード認証ゲート
  if (!authed) {
    return (
      <div style={{ minHeight: "100vh", background: "#F8F4E6", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Noto Sans JP', sans-serif" }}>
        <div style={{ background: "#ffffff", borderRadius: "16px", padding: "32px 24px", width: "320px", textAlign: "center", boxShadow: "0 2px 8px rgba(0,0,0,0.08)" }}>
          <h1 style={{ fontSize: "24px", fontWeight: "bold", color: "#0f172a", margin: "0 0 4px" }}>SEIKO</h1>
          <p style={{ color: "#64748b", fontSize: "13px", margin: "0 0 24px" }}>知識を、力に。</p>
          <p style={{ fontSize: "14px", color: "#475569", marginBottom: "16px" }}>パスワードを入力してください</p>
          <input type="password" value={pwInput} onChange={e => { setPwInput(e.target.value); setPwError(false); }}
            onKeyDown={e => e.key === "Enter" && handleAuth()}
            placeholder="パスワード" style={{ width: "100%", padding: "12px", border: `2px solid ${pwError ? "#ef4444" : "#e2e8f0"}`, borderRadius: "8px", fontSize: "16px", textAlign: "center", marginBottom: "12px", boxSizing: "border-box" }} />
          {pwError && <p style={{ color: "#ef4444", fontSize: "12px", margin: "0 0 12px" }}>パスワードが違います</p>}
          <button onClick={handleAuth} style={{ width: "100%", background: "#2563eb", color: "white", border: "none", padding: "12px", borderRadius: "8px", cursor: "pointer", fontSize: "15px", fontWeight: "bold" }}>ログイン</button>
        </div>
      </div>
    );
  }

  // ── 科目選択画面 ──
  const SUBJECTS = [
    { id: "sekou1",  name: "一級電気工事施工管理技士", short: "一施管", icon: "S1", color: "#2563eb", ready: true, desc: "R1〜R7 全問収録" },
    { id: "denkou1", name: "第一種電気工事士", short: "電工一種", icon: "D1", color: "#0891b2", ready: false, desc: "準備中" },
    { id: "denken3", name: "第三種電気主任技術者", short: "電験三種", icon: "D3", color: "#7c3aed", ready: false, desc: "準備中" },
    { id: "kiken4",  name: "危険物取扱者 乙種第四類", short: "危険物乙4", icon: "K4", color: "#dc2626", ready: false, desc: "準備中" },
    { id: "shobo4",  name: "消防設備士 乙種第四類", short: "消防乙4", icon: "B4", color: "#ea580c", ready: false, desc: "準備中" },
    { id: "eiken",   name: "英語（英検準拠）", short: "英語", icon: "EN", color: "#059669", ready: false, desc: "準備中" },
    { id: "topik",   name: "韓国語（TOPIK準拠）", short: "韓国語", icon: "KR", color: "#2563eb", ready: false, desc: "準備中" },
    { id: "tagalog", name: "タガログ語", short: "タガログ語", icon: "TL", color: "#0284c7", ready: false, desc: "準備中" },
  ];

  function selectSubject(subj) {
    if (!subj.ready) return;
    setCurrentSubject(subj.id);
    setView("home");
  }

  if (view === "select") {
    return (
      <div style={{ minHeight: "100vh", background: "#F8F4E6", fontFamily: "'Noto Sans JP', sans-serif", padding: "16px" }}>
        <div style={{ maxWidth: "720px", margin: "0 auto" }}>
          <div style={{ textAlign: "center", marginBottom: "28px", paddingTop: "20px" }}>
            <h1 style={{ fontSize: "26px", fontWeight: "bold", color: "#0f172a", margin: "0 0 4px" }}>SEIKO</h1>
            <p style={{ color: "#64748b", fontSize: "14px", margin: 0 }}>知識を、力に。</p>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px", marginBottom: "24px" }}>
            {SUBJECTS.map(s => {
              var totalInfo = "";
              if (s.ready) {
                var tq = Object.keys(QUESTION_BANK).reduce(function(sum, yr) { return sum + Object.keys(QUESTION_BANK[yr].questions).length; }, 0);
                var tm = MARUBATSU_DATA.length;
                totalInfo = "4\u629e " + tq + "\u554f \uff0f \u25cb\u00d7 " + tm + "\u554f";
              }
              return (
                <button key={s.id} onClick={function() { selectSubject(s); }} style={{
                  background: "#ffffff",
                  border: "2px solid " + (s.ready ? s.color : "#e2e8f0"),
                  borderRadius: "14px",
                  padding: "18px 14px",
                  cursor: s.ready ? "pointer" : "default",
                  textAlign: "left",
                  opacity: s.ready ? 1 : 0.5
                }}>
                  <div style={{ display: "inline-block", background: s.color, color: "#fff", fontSize: "12px", fontWeight: "bold", padding: "4px 8px", borderRadius: "6px", marginBottom: "8px" }}>{s.icon}</div>
                  <div style={{ fontSize: "14px", fontWeight: "bold", color: "#0f172a", marginBottom: "2px", lineHeight: "1.3" }}>{s.short}</div>
                  <div style={{ fontSize: "11px", color: "#64748b", lineHeight: "1.4", marginBottom: "8px" }}>{s.name}</div>
                  <div style={{ fontSize: "11px", color: s.ready ? s.color : "#94a3b8", fontWeight: s.ready ? "bold" : "normal" }}>
                    {s.ready ? s.desc : s.desc}
                  </div>
                  {totalInfo && <div style={{ marginTop: "8px", fontSize: "10px", color: "#94a3b8" }}>{totalInfo}</div>}
                </button>
              );
            })}
          </div>

          <div style={{ textAlign: "center", fontSize: "11px", color: "#94a3b8" }}>
            v20 — 科目は順次追加予定
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: "#F8F4E6", color: "#1e293b", fontFamily: "'Noto Sans JP', sans-serif", padding: "16px" }}>
      <div style={{ maxWidth: "720px", margin: "0 auto" }}>
        <div style={{ marginBottom: "20px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <h1 style={{ fontSize: "20px", fontWeight: "bold", margin: "0 0 4px", color: "#0f172a" }}>SEIKO</h1>
            <p style={{ color: "#64748b", fontSize: "13px", margin: 0 }}>知識を、力に。</p>
          </div>
          {view === "home" && (
            <button onClick={() => { flushStudyTime(); setView("select"); setCurrentSubject(null); }} style={{
              background: "none", border: "1px solid #e2e8f0", color: "#64748b",
              padding: "6px 12px", borderRadius: "6px", cursor: "pointer", fontSize: "12px"
            }}>← 科目選択</button>
          )}
        </div>

        {/* 6. 途中再開ボタン */}
        {view === "home" && loadQuizState() && (() => {
          const st = loadQuizState();
          const b = QUESTION_BANK[st.year];
          if (!b) return null;
          const remaining = st.queue.length - (st.idx || 0);
          return (
            <button onClick={resumeQuiz} style={{ width: "100%", background: "#f59e0b", color: "white", border: "none", padding: "14px", borderRadius: "8px", cursor: "pointer", fontSize: "15px", fontWeight: "bold", marginBottom: "16px" }}>
              続きから再開（{b.label} 残り{remaining}問）
            </button>
          );
        })()}

          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: "11px", color: "#94a3b8", marginBottom: "4px", fontWeight: "bold" }}>施工（SEIKO）より</div>
            {chatLoading ? (
              <div style={{ color: "#cbd5e1", fontSize: "13px" }}>……</div>
            ) : (
              <p style={{ fontSize: "14px", color: "#1e293b", lineHeight: "1.65", margin: 0 }}>{chatMsg}</p>
            )}
          </div>
        </div>

        {/* 勉強時間 */}
        {(() => {
          const today = todayKey();
          const todaySec = studyTime[today] || 0;
          const totalSec = Object.values(studyTime).reduce((a, b) => a + b, 0);
          const fmt = sec => {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return h > 0 ? `${h}時間${m}分` : m > 0 ? `${m}分${s}秒` : `${s}秒`;
          };
          return (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px", marginBottom: "20px" }}>
              <div style={{ background: "#ffffff", borderRadius: "10px", padding: "14px", textAlign: "center" }}>
                <div style={{ fontSize: "11px", color: "#94a3b8", marginBottom: "6px" }}>📅 今日の勉強時間</div>
                <div style={{ fontSize: "22px", fontWeight: "bold", color: todaySec > 0 ? "#2563eb" : "#cbd5e1" }}>
                  {todaySec > 0 ? fmt(todaySec) : "---"}
                </div>
              </div>
              <div style={{ background: "#ffffff", borderRadius: "10px", padding: "14px", textAlign: "center" }}>
                <div style={{ fontSize: "11px", color: "#94a3b8", marginBottom: "6px" }}>📚 累計勉強時間</div>
                <div style={{ fontSize: "22px", fontWeight: "bold", color: totalSec > 0 ? "#7c3aed" : "#cbd5e1" }}>
                  {totalSec > 0 ? fmt(totalSec) : "---"}
                </div>
              </div>
            </div>
          );
        })()}

        {/* 得意不得意分析 */}
        {(() => {
          const analysis = getAnalysis();
          if (analysis.length === 0) return (
            <div style={{ background: "#ffffff", borderRadius: "10px", padding: "14px", marginBottom: "20px", color: "#94a3b8", fontSize: "13px", textAlign: "center" }}>
              📊 3問以上回答するとカテゴリ別分析が表示されます
            </div>
          );
          const weak = analysis.slice(0, 3);
          const strong = [...analysis].sort((a,b) => b.pct - a.pct).slice(0, 3);
          return (
            <div style={{ background: "#ffffff", borderRadius: "10px", padding: "14px", marginBottom: "20px" }}>
              <div style={{ fontWeight: "bold", fontSize: "13px", color: "#0f172a", marginBottom: "12px" }}>📊 得意・不得意分析</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px" }}>
                <div>
                  <div style={{ fontSize: "11px", color: "#dc2626", fontWeight: "bold", marginBottom: "6px" }}>⚠ 苦手カテゴリ</div>
                  {weak.map(({ cat, pct, total }) => (
                    <div key={cat} style={{ marginBottom: "6px" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: "11px", color: "#475569", marginBottom: "2px" }}>
                        <span>{cat}</span><span style={{ color: "#dc2626", fontWeight: "bold" }}>{pct}%</span>
                      </div>
                      <div style={{ background: "#fee2e2", borderRadius: "3px", height: "4px" }}>
                        <div style={{ background: "#dc2626", height: "100%", borderRadius: "3px", width: `${pct}%` }} />
                      </div>
                    </div>
                  ))}
                </div>
                <div>
                  <div style={{ fontSize: "11px", color: "#16a34a", fontWeight: "bold", marginBottom: "6px" }}>✨ 得意カテゴリ</div>
                  {strong.map(({ cat, pct }) => (
                    <div key={cat} style={{ marginBottom: "6px" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: "11px", color: "#475569", marginBottom: "2px" }}>
                        <span>{cat}</span><span style={{ color: "#16a34a", fontWeight: "bold" }}>{pct}%</span>
                      </div>
                      <div style={{ background: "#dcfce7", borderRadius: "3px", height: "4px" }}>
                        <div style={{ background: "#16a34a", height: "100%", borderRadius: "3px", width: `${pct}%` }} />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        })()}

        {/* ○×クイズ */}
        {(() => {
          const mbYears = ["all", "R7", "R6", "R5", "R4", "R3", "R2", "R1"];
          const mbTotal = mbYear === "all" ? MARUBATSU_DATA.length : MARUBATSU_DATA.filter(d => d.year === mbYear).length;
          const mbAnswered = (mbYear === "all" ? MARUBATSU_DATA : MARUBATSU_DATA.filter(d => d.year === mbYear)).filter(d => mbHistory[d.id]).length;
          const mbWrong = (mbYear === "all" ? MARUBATSU_DATA : MARUBATSU_DATA.filter(d => d.year === mbYear)).filter(d => mbHistory[d.id] && mbHistory[d.id].lastAns === false).length;
          const mbUnanswered = mbTotal - mbAnswered;
          return (
            <div style={{ background: "#fefce8", border: "1.5px solid #fde68a", borderRadius: "12px", padding: "16px 18px", marginBottom: "14px" }}>
              <div style={{ color: "#92400e", fontWeight: "bold", fontSize: "15px", marginBottom: "3px" }}>⭕ ○×クイズ（暗記特化）</div>
              <div style={{ color: "#a16207", fontSize: "12px", marginBottom: "10px" }}>R1〜R7の用語・法規・数値を496問の○×で反復</div>
              <div style={{ display: "flex", gap: "4px", marginBottom: "10px", flexWrap: "wrap" }}>
                {mbYears.map(y => (
                  <button key={y} onClick={() => setMbYear(y)} style={{ background: mbYear === y ? "#f59e0b" : "#fff", color: mbYear === y ? "#fff" : "#92400e", border: `1px solid ${mbYear === y ? "#f59e0b" : "#fde68a"}`, padding: "4px 10px", borderRadius: "6px", cursor: "pointer", fontSize: "12px" }}>
                    {y === "all" ? "全年度" : y}
                  </button>
                ))}
              </div>
              <div style={{ fontSize: "12px", color: "#78716c", marginBottom: "10px", display: "flex", gap: "12px" }}>
                <span>全{mbTotal}問</span><span>回答済 {mbAnswered}</span><span style={{ color: "#dc2626" }}>前回×: {mbWrong}</span><span>未回答: {mbUnanswered}</span>
              </div>
              <div style={{ display: "flex", gap: "6px" }}>
                <button onClick={() => startMarubatsu(mbYear, "all")} style={{ flex: 1, background: "#f59e0b", color: "#fff", border: "none", padding: "11px", borderRadius: "8px", cursor: "pointer", fontSize: "13px", fontWeight: "bold" }}>全問({mbTotal})</button>
                <button onClick={() => startMarubatsu(mbYear, "wrong")} disabled={mbWrong === 0} style={{ flex: 1, background: mbWrong > 0 ? "#ef4444" : "#e5e7eb", color: mbWrong > 0 ? "#fff" : "#9ca3af", border: "none", padding: "11px", borderRadius: "8px", cursor: mbWrong > 0 ? "pointer" : "default", fontSize: "13px", fontWeight: "bold" }}>前回×({mbWrong})</button>
                <button onClick={() => startMarubatsu(mbYear, "unanswered")} disabled={mbUnanswered === 0} style={{ flex: 1, background: mbUnanswered > 0 ? "#6366f1" : "#e5e7eb", color: mbUnanswered > 0 ? "#fff" : "#9ca3af", border: "none", padding: "11px", borderRadius: "8px", cursor: mbUnanswered > 0 ? "pointer" : "default", fontSize: "13px", fontWeight: "bold" }}>未回答({mbUnanswered})</button>
              </div>
            </div>
          );
        })()}

        {/* 日報・日記 */}
        <button onClick={() => setView("glossary")} style={{ width: "100%", background: "#fff", border: "1.5px solid #e2e8f0", borderRadius: "12px", padding: "14px 18px", cursor: "pointer", marginBottom: "14px", display: "flex", alignItems: "center", gap: "12px", textAlign: "left" }}>
          <span style={{ fontSize: "24px" }}>📖</span>
          <div>
            <div style={{ fontWeight: "bold", fontSize: "14px", color: "#1e293b" }}>用語辞書</div>
            <div style={{ fontSize: "12px", color: "#64748b" }}>検索・閲覧・追加 ／ {glossary.length}語収録</div>
          </div>
        </button>

        <button onClick={() => setView("diary")} style={{ width: "100%", background: "#fff", border: "1.5px solid #e2e8f0", borderRadius: "12px", padding: "14px 18px", cursor: "pointer", marginBottom: "14px", display: "flex", alignItems: "center", gap: "12px", textAlign: "left" }}>
          <span style={{ fontSize: "24px" }}>📋</span>
          <div>
            <div style={{ fontWeight: "bold", fontSize: "14px", color: "#1e293b" }}>現場日報・学習日記</div>
            <div style={{ fontSize: "12px", color: "#64748b" }}>日報 {reportEntries.length}件 ／ 日記 {diaryEntries.length}件</div>
          </div>
        </button>

        {/* 模擬試験 */}
        <div style={{ background: "#eff6ff", border: "1.5px solid #bfdbfe", borderRadius: "12px", padding: "16px 18px", marginBottom: "20px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "10px" }}>
            <div>
              <div style={{ color: "#1e40af", fontWeight: "bold", fontSize: "15px", marginBottom: "3px" }}>📝 模擬試験モード</div>
              <div style={{ color: "#3b82f6", fontSize: "12px" }}>5年分からランダム抽出・本番と同じ出題構成（60問）⏱タイマーあり</div>
            </div>
          </div>
          <div style={{ display: "flex", gap: "6px", flexWrap: "wrap", marginBottom: "12px" }}>
            {MOCK_SECTION_DEFS.map(s => (
              <span key={s.id} style={{ background: s.required ? "#dbeafe" : "#f1f5f9", color: s.required ? "#1d4ed8" : "#475569", border: `1px solid ${s.required ? "#93c5fd" : "#e2e8f0"}`, padding: "2px 9px", borderRadius: "99px", fontSize: "11px" }}>
                {s.label.split('）')[0]}）{s.count}問{s.required ? "【必】" : "【選】"}
              </span>
            ))}
          </div>
          <button onClick={startMock} style={{ width: "100%", background: "#2563eb", color: "white", border: "none", padding: "13px", borderRadius: "8px", cursor: "pointer", fontSize: "15px", fontWeight: "bold" }}>
            模擬試験をスタート（60問）
          </button>
        </div>

        {/* 年度タブ */}
        <div style={{ display: "flex", gap: "6px", marginBottom: "20px", flexWrap: "wrap" }}>
          {YEAR_ORDER.map(yr => {
            const st = getStats(yr);
            const pct = st.answered ? Math.round(st.correct / st.answered * 100) : 0;
            return (
              <button key={yr} onClick={() => setYear(yr)} style={{ background: year === yr ? "#2563eb" : "#ffffff", border: `1px solid ${year === yr ? "#3b82f6" : "#e2e8f0"}`, color: year === yr ? "white" : "#64748b", padding: "8px 14px", borderRadius: "8px", cursor: "pointer", fontSize: "13px" }}>
                {yr}
                {st.answered > 0 && <span style={{ marginLeft: "6px", color: year === yr ? "#2563eb" : "#64748b", fontSize: "11px" }}>{pct}%</span>}
              </button>
            );
          })}
        </div>

        {/* 年度情報 */}
        <div style={{ background: "#ffffff", borderRadius: "10px", padding: "14px", marginBottom: "16px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "10px" }}>
            <span style={{ fontWeight: "bold", color: "#0f172a" }}>{bank.label}（{bank.examDate}）</span>
            <span style={{ color: "#64748b", fontSize: "12px" }}>{allQ.length}問</span>
          </div>
          {(() => {
            const st = getStats(year);
            const pct = st.answered ? Math.round(st.correct / st.answered * 100) : 0;
            return (
              <>
                <div style={{ background: "#e2e8f0", borderRadius: "6px", height: "6px", marginBottom: "8px" }}>
                  <div style={{ background: "#2563eb", height: "100%", borderRadius: "6px", width: `${st.total ? st.answered / st.total * 100 : 0}%`, transition: "width 0.3s" }} />
                </div>
                <div style={{ display: "flex", gap: "16px", fontSize: "12px", color: "#64748b" }}>
                  <span>回答済 {st.answered}/{st.total}</span>
                  <span>正解率 {st.answered ? pct : "-"}%</span>
                </div>
              </>
            );
          })()}
        </div>

        {/* フィルター */}
        <div style={{ display: "flex", gap: "6px", marginBottom: "16px" }}>
          {[["all","全問題"],["wrong","前回不正解"],["unanswered","未回答"]].map(([k, l]) => (
            <button key={k} onClick={() => setFilter(k)} style={{ background: filter === k ? "#dbeafe" : "#ffffff", border: `1px solid ${filter === k ? "#3b82f6" : "#1e293b"}`, color: filter === k ? "#2563eb" : "#64748b", padding: "6px 12px", borderRadius: "6px", cursor: "pointer", fontSize: "12px" }}>{l}</button>
          ))}
        </div>

        {/* 一括スタートボタン（順番 / ランダム） */}
        <div style={{ display: "flex", gap: "8px", marginBottom: "16px" }}>
          <button onClick={() => startQuiz(year, null, filter, false)} style={{ flex: 1, background: "#2563eb", color: "white", border: "none", padding: "14px", borderRadius: "8px", cursor: "pointer", fontSize: "14px", fontWeight: "bold" }}>
            No.1から順番（{getFilteredQ(year, null, filter).length}問）
          </button>
          <button onClick={() => startQuiz(year, null, filter, true)} style={{ flex: 1, background: "#7c3aed", color: "white", border: "none", padding: "14px", borderRadius: "8px", cursor: "pointer", fontSize: "14px", fontWeight: "bold" }}>
            ランダム（{getFilteredQ(year, null, filter).length}問）
          </button>
        </div>

        {/* セクション一覧 */}
        <div style={{ display: "flex", flexDirection: "column", gap: "8px", marginBottom: "20px" }}>
          {bank.sections.map(sec => {
            const qs = getFilteredQ(year, sec, filter);
            const answered = sec.questionNos.filter(n => progress[`${year}_${n}`] !== undefined).length;
            const correct = sec.questionNos.filter(n => progress[`${year}_${n}`] === true).length;
            return (
              <div key={sec.id} style={{ background: "#ffffff", borderRadius: "8px", padding: "12px 14px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
                  <div>
                    <div style={{ fontSize: "13px", color: "#1e293b", marginBottom: "3px" }}>{sec.label}</div>
                    <div style={{ fontSize: "11px", color: "#64748b" }}>回答 {answered}/{sec.questionNos.length} 　正解 {correct}</div>
                  </div>
                  <span style={{ fontSize: "12px", color: "#94a3b8" }}>{qs.length}問</span>
                </div>
                <div style={{ display: "flex", gap: "6px" }}>
                  <button onClick={() => startQuiz(year, sec, filter, false)} disabled={qs.length === 0} style={{ flex: 1, background: qs.length > 0 ? "#2563eb" : "#e5e7eb", color: qs.length > 0 ? "#fff" : "#9ca3af", border: "none", padding: "8px 6px", borderRadius: "6px", cursor: qs.length > 0 ? "pointer" : "default", fontSize: "12px", fontWeight: "bold" }}>
                    順番
                  </button>
                  <button onClick={() => startQuiz(year, sec, filter, true)} disabled={qs.length === 0} style={{ flex: 1, background: qs.length > 0 ? "#7c3aed" : "#e5e7eb", color: qs.length > 0 ? "#fff" : "#9ca3af", border: "none", padding: "8px 6px", borderRadius: "6px", cursor: qs.length > 0 ? "pointer" : "default", fontSize: "12px", fontWeight: "bold" }}>
                    ランダム
                  </button>
                </div>
              </div>
            );
          })}
        </div>

        <button
          onClick={exportQuestions}
          style={{
            position: 'fixed', bottom: 16, right: 16,
            padding: '8px 14px', background: '#4ade80',
            border: 'none', borderRadius: 8,
            cursor: 'pointer', fontSize: 13, zIndex: 9999
          }}
        >
          📥 JSONエクスポート
        </button>
        <div style={{ textAlign: "center", display: "flex", gap: "8px", justifyContent: "center", flexWrap: "wrap", marginBottom: "8px" }}>
          <button onClick={exportStudyData} style={{ background: "#3b82f6", color: "white", border: "none", padding: "6px 14px", borderRadius: "6px", cursor: "pointer", fontSize: "12px" }}>💾 学習データ保存</button>
          <label style={{ background: "#10b981", color: "white", border: "none", padding: "6px 14px", borderRadius: "6px", cursor: "pointer", fontSize: "12px" }}>
            📂 学習データ復元
            <input type="file" accept=".json" onChange={importStudyData} style={{ display: "none" }} />
          </label>
        </div>
        <div style={{ textAlign: "center" }}>
          <button onClick={resetProgress} style={{ background: "none", border: "1px solid #e2e8f0", color: "#64748b", padding: "6px 14px", borderRadius: "6px", cursor: "pointer", fontSize: "12px" }}>進捗リセット</button>
        </div>
      </div>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => {
            reg.addEventListener('updatefound', () => {
              const newSW = reg.installing;
              newSW.addEventListener('statechange', () => {
                if (newSW.state === 'activated') {
                  if (confirm('アプリが更新されました。再読み込みしますか？')) {
                    window.location.reload();
                  }
                }
              });
            });
          })
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
